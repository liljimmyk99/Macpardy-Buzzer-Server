name: Release

# Publishes the self-hosted buzzer server image to GHCR (#105). It has its own version, in
# VERSION, separate from the Macpardy app's version. Started by hand
# from master (Actions tab, or `gh workflow run release.yml`). It tags the commit
# `<version>`, and fails if that tag exists, so bump VERSION first.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "::error::Images are published from master; this run was started on $GITHUB_REF."
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::Expected a version like 1.2.3, found: $version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error file=VERSION::$version is already published. Bump VERSION first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          docker run --rm -v "$PWD:/pkg" -w /pkg swift:6.2-noble swift test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/macpardy-buzzer-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/macpardy-buzzer-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
