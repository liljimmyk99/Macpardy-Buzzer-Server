name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # global WebSocket, for the smoke test

      - name: Build image
        run: docker build -t macpardy-buzzer-server .

      - name: Smoke test
        run: |
          token="$(openssl rand -hex 24)"
          docker run -d --name buzzer -p 8472:8472 -e MACPARDY_HOST_TOKEN="$token" macpardy-buzzer-server
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8472/healthz && break; sleep 1; done
          node scripts/smoke-test.mjs http://127.0.0.1:8472 "$token"
          docker logs buzzer
